name: Intel Wine bootstrap diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intel-wine-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intel-diagnostic:
    name: Native Intel Wine and taskpolicy diagnosis
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe pinned runtime using bounded owned fixtures
        run: python3 ci/intel_wine_native.py
      - name: Upload curated diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intel-wine-diagnostic
          path: artifacts/intel-wine-diagnostic/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
