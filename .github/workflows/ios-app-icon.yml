name: Native iOS AppIcon formatting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icon:
    name: Original brand opaque AppIcon — CoreGraphics
    runs-on: macos-15
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format and verify exact supplied brand on native Mac
        run: python3 ci/app_icon_native.py
      - name: Upload real native asset and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-app-icon-native
          path: artifacts/ios-app-icon/
          if-no-files-found: error
          retention-days: 30
